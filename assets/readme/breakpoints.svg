<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t2 d2">
<title id="t2">How NavBarz picks a mode</title>
<desc id="d2">Under 600dp wide NavBarz draws a bottom bar; from 600dp a navigation rail; from 1200dp a permanent drawer. Below 480dp of height it stays on the bottom bar whatever the width.</desc>
<rect width="1200" height="330" rx="28" fill="#101114"/>
<svg x="198.66666666666666" y="48" width="88.0" height="88.0" viewBox="0 0 120.0 120.0"><path fill="#FFFFFF" fill-rule="evenodd" d="M28,0 H92 A28,28 0 0 1 120,28 V92 A28,28 0 0 1 92,120 H28 A28,28 0 0 1 0,92 V28 A28,28 0 0 1 28,0 Z M28,78 H92 A13,13 0 0 1 105,91 V92 A13,13 0 0 1 92,105 H28 A13,13 0 0 1 15,92 V91 A13,13 0 0 1 28,78 Z M30,91 A7,7 0 1 0 44,91 A7,7 0 1 0 30,91 Z M76,91 A7,7 0 1 0 90,91 A7,7 0 1 0 76,91 Z"/><path fill="#FF5A1F" fill-rule="evenodd" d="M53,91 A7,7 0 1 0 67,91 A7,7 0 1 0 53,91 Z"/></svg>
<text x="242.66666666666666" y="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bottom bar</text>
<text x="242.66666666666666" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#8A8F98" text-anchor="middle">under 600dp</text>
<svg x="556.0" y="48" width="88.0" height="88.0" viewBox="0 0 120.0 120.0"><path fill="#FFFFFF" fill-rule="evenodd" d="M28,0 H92 A28,28 0 0 1 120,28 V92 A28,28 0 0 1 92,120 H28 A28,28 0 0 1 0,92 V28 A28,28 0 0 1 28,0 Z M28,15 H29 A13,13 0 0 1 42,28 V92 A13,13 0 0 1 29,105 H28 A13,13 0 0 1 15,92 V28 A13,13 0 0 1 28,15 Z M21,37 A7,7 0 1 0 35,37 A7,7 0 1 0 21,37 Z M21,83 A7,7 0 1 0 35,83 A7,7 0 1 0 21,83 Z"/><path fill="#FF5A1F" fill-rule="evenodd" d="M21,60 A7,7 0 1 0 35,60 A7,7 0 1 0 21,60 Z"/></svg>
<text x="600.0" y="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rail</text>
<text x="600.0" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#8A8F98" text-anchor="middle">600dp and up</text>
<svg x="913.3333333333333" y="48" width="88.0" height="88.0" viewBox="0 0 120.0 120.0"><path fill="#FFFFFF" fill-rule="evenodd" d="M28,0 H92 A28,28 0 0 1 120,28 V92 A28,28 0 0 1 92,120 H28 A28,28 0 0 1 0,92 V28 A28,28 0 0 1 28,0 Z M28,15 H44 A13,13 0 0 1 57,28 V92 A13,13 0 0 1 44,105 H28 A13,13 0 0 1 15,92 V28 A13,13 0 0 1 28,15 Z M20,37 A6,6 0 1 0 32,37 A6,6 0 1 0 20,37 Z M20,83 A6,6 0 1 0 32,83 A6,6 0 1 0 20,83 Z M39,34 H46 A3,3 0 0 1 49,37 V37 A3,3 0 0 1 46,40 H39 A3,3 0 0 1 36,37 V37 A3,3 0 0 1 39,34 Z M39,80 H46 A3,3 0 0 1 49,83 V83 A3,3 0 0 1 46,86 H39 A3,3 0 0 1 36,83 V83 A3,3 0 0 1 39,80 Z"/><path fill="#FF5A1F" fill-rule="evenodd" d="M20,60 A6,6 0 1 0 32,60 A6,6 0 1 0 20,60 Z M39,57 H46 A3,3 0 0 1 49,60 V60 A3,3 0 0 1 46,63 H39 A3,3 0 0 1 36,60 V60 A3,3 0 0 1 39,57 Z"/></svg>
<text x="957.3333333333333" y="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">Drawer</text>
<text x="957.3333333333333" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="400" fill="#8A8F98" text-anchor="middle">1200dp and up</text>
<rect x="64" y="160" width="1072" height="3" rx="1.5" fill="#2A2D33"/>
<rect x="419.8" y="152" width="3" height="19" rx="1.5" fill="#FF5A1F"/>
<rect x="777.2" y="152" width="3" height="19" rx="1.5" fill="#FF5A1F"/>
<text x="600.0" y="294" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="400" fill="#8A8F98" text-anchor="middle">…and never a rail or a drawer under 480dp of height — a landscape phone is 891dp wide but only 411dp tall.</text>
